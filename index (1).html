<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Neuroglobe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL globe as the stage; all UI floats above it on frosted-glass layers (bar, HUD, side panel / bottom sheet on tablets-portrait and phones). Dark-only by design, three colorways via data-palette. */
:root{
  --bg:#07051a; --glass:rgba(24,17,54,.52); --glass-strong:rgba(17,12,40,.74);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.17);
  --text:#efeaff; --muted:#a49ec9; --accent:#b99dff; --accent-2:#f2a7ff;
  --glow:rgba(160,118,255,.55); --on-accent:#16092f; --danger:#ff8f8f;
  --f-display:"Prata","Georgia","Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --panel-w:min(420px,40vw); --gap:16px; --r-lg:24px; --r:14px;
  color-scheme:dark;
}
:root[data-palette="azure"]{--bg:#03121c;--glass:rgba(10,38,54,.5);--glass-strong:rgba(7,28,42,.74);--text:#e7fbff;--muted:#8fb8c6;--accent:#72e6ff;--accent-2:#a3fff0;--glow:rgba(80,220,255,.5);--on-accent:#02232e}
:root[data-palette="rose"]{--bg:#16070f;--glass:rgba(58,20,40,.48);--glass-strong:rgba(40,13,28,.74);--text:#fff1f6;--muted:#d0a5b8;--accent:#ffb3cf;--accent-2:#ffd9e8;--glow:rgba(255,150,198,.5);--on-accent:#3d0c22}
:root[data-palette="blue"]{--bg:#030818;--glass:rgba(14,26,62,.52);--glass-strong:rgba(9,18,46,.76);--text:#eaf0ff;--muted:#98a6d2;--accent:#7ea6ff;--accent-2:#9b8cff;--glow:rgba(88,128,255,.58);--on-accent:#06102e}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .6s}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#scene{position:fixed;inset:0;z-index:0}
#globe{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rl{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:rgba(255,255,255,.78);text-shadow:0 0 14px rgba(0,0,0,.9)}
.rl i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 10px currentColor}
.rl.on{color:#fff;font-size:11.5px}

.glass{background:var(--glass);background-image:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 70px -24px rgba(0,0,0,.7)}

.bar{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));height:60px;border-radius:20px;display:flex;align-items:center;gap:14px;padding:0 10px 0 18px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em}
.brand svg{filter:drop-shadow(0 0 8px var(--glow))}
.brand small{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--muted);border:1px solid var(--stroke);border-radius:999px;padding:3px 8px;text-transform:uppercase}
.bar .sp{flex:1}
.pals{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(0,0,0,.18);border:1px solid var(--stroke)}
.pals button{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;position:relative;transition:transform .2s}
.pals button:hover{transform:scale(1.08)}
.pals button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #fff,0 0 18px 2px var(--glow)}
.pals [data-p="violet"]{background:radial-gradient(circle at 35% 30%,#f2c7ff,#9b6bff 55%,#3b1a8f)}
.pals [data-p="azure"]{background:radial-gradient(circle at 35% 30%,#d6fbff,#40d4f5 55%,#0b5d7a)}
.pals [data-p="rose"]{background:radial-gradient(circle at 35% 30%,#fff0f6,#ff9ec4 55%,#a3376a)}
.pals [data-p="blue"]{background:radial-gradient(circle at 35% 30%,#d4e0ff,#4f7dff 55%,#1a2a8a)}
.acct{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px 0 12px;border-radius:999px;background:rgba(0,0,0,.18);border:1px solid var(--stroke);font-size:13px;min-width:0;max-width:260px}
.acct b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.acct .dot.ok{background:#7ff0b5;box-shadow:0 0 10px #7ff0b5}.acct .dot.warn{background:#ffc979;box-shadow:0 0 10px #ffc979}

.hud .play+.play{margin-top:0}
.hud{position:fixed;z-index:2;top:calc(100px + env(safe-area-inset-top,0px));left:max(28px,calc(env(safe-area-inset-left,0px) + 16px));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:44vw}
.hud .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.hud .big{font-family:var(--f-display);font-weight:300;font-size:64px;line-height:1;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 20%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px var(--glow));font-variant-numeric:tabular-nums}
.hud .sub{font-size:14px;color:var(--muted)}
.hud .sub b{color:var(--text);font-weight:600}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

.doms{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(var(--panel-w) + 40px + 56px);display:flex;flex-wrap:wrap;gap:8px}
.dch{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.dch i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor}
.dch:hover{border-color:var(--stroke-2)}
.dch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 22px -4px var(--glow),inset 0 1px 0 rgba(255,255,255,.1)}
.zoom{position:fixed;z-index:2;right:calc(var(--panel-w) + 40px);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.zoom button{width:42px;height:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:18px}
.zoom button:hover{border-color:var(--stroke-2)}

.tip{position:fixed;z-index:6;pointer-events:none;border-radius:var(--r);padding:10px 14px;transform:translate(-50%,calc(-100% - 18px));min-width:180px;max-width:280px;transition:opacity .15s}
.tip .t{font-weight:600;font-size:14px;line-height:1.3}
.tip .a{font-size:12.5px;color:var(--muted)}
.tip .d{display:flex;align-items:center;gap:6px;margin-top:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.tip .d i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 8px currentColor}

.panel{position:fixed;z-index:4;top:calc(84px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:var(--panel-w);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;background-color:var(--glass-strong)}
.grab{display:none}
.seg{display:flex;gap:4px;margin:12px 12px 0;padding:4px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--stroke);overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:9px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .2s,background .2s,box-shadow .2s}
.seg button:hover{color:var(--text)}
.seg button[aria-selected="true"]{color:var(--text);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px var(--stroke-2),0 6px 24px -6px var(--glow)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:22px 22px 28px;display:flex;flex-direction:column;gap:20px;scrollbar-width:thin;scrollbar-color:var(--stroke-2) transparent}
.pane > *{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.pane > *:nth-child(2){animation-delay:.04s}.pane > *:nth-child(3){animation-delay:.08s}.pane > *:nth-child(4){animation-delay:.12s}.pane > *:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.25;letter-spacing:0;margin:6px 0 0;text-wrap:balance}
h2.disp{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:0;line-height:1.3}
p{margin:0}
.sub{color:var(--muted);font-size:14px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:13px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--stroke-2);background:rgba(255,255,255,.06);transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.98)}
.btn.primary{border:0;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 34px -8px var(--glow),0 0 0 1px rgba(255,255,255,.12)}
.btn.primary:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 14px 44px -6px var(--glow),0 0 0 1px rgba(255,255,255,.2)}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:none}
.btn.ghost{background:none}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--muted)}
.field input,.field select{height:48px;border-radius:13px;background:rgba(0,0,0,.24);border:1px solid var(--stroke);padding:0 14px;font-size:15px;color:var(--text);transition:border-color .2s,box-shadow .2s;width:100%}
.field input:focus,.field select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent),0 0 24px -6px var(--glow)}
.field input::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.search{position:relative}
.search svg{position:absolute;left:14px;bottom:15px;opacity:.6;pointer-events:none}
.search input{padding-left:42px}

.card{border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--stroke);padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-size:12.5px;font-weight:500}
.chip i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;border-top:1px solid var(--stroke);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.dom:first-of-type{border-top:0;padding-top:4px}
.dom .nm{display:flex;align-items:center;gap:9px;font-weight:600}
.dom .nm i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor}
.dom .pc{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dom .meter,.dom .tx{grid-column:1/-1}
.dom .tx{font-size:13.5px;color:color-mix(in srgb,var(--text) 78%,transparent)}
.dom .rg{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em;display:block;margin-top:2px}
.dom:hover .nm{color:#fff}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;box-shadow:0 0 12px currentColor}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;font-size:24px;line-height:1;padding:2px;cursor:pointer;color:rgba(255,255,255,.18);transition:color .15s,text-shadow .15s}
.stars button.on{color:var(--accent);text-shadow:0 0 14px var(--glow)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 6px;margin:0 -6px;border-radius:12px;border:0;background:none;text-align:left;cursor:pointer;width:calc(100% + 12px);transition:background .15s}
.item:hover{background:rgba(255,255,255,.05)}
.item .n{grid-row:span 2;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.item .n i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{font-size:12.5px;color:var(--muted);grid-column:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{grid-row:1/3;grid-column:3;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.item .plus{grid-row:1/3;grid-column:3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--stroke-2);font-size:16px;color:var(--accent)}
.item:hover .plus{background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:0 0 16px -2px var(--glow)}
.rec{display:flex;flex-direction:column;gap:10px}
.rec .t{font-weight:600;font-size:17px;line-height:1.3}
.rec .why{font-size:13.5px;color:color-mix(in srgb,var(--text) 72%,transparent)}
.recs{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.06em}
.note{font-size:12px;line-height:1.55;color:var(--muted);padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--stroke)}
.hr{height:1px;background:var(--stroke)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.radar{display:block;width:100%;max-width:340px;margin:0 auto;overflow:visible}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.toast{position:fixed;z-index:9;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 0 30px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.1)}
.pop{position:fixed;z-index:7;left:0;top:0;width:min(340px,calc(100vw - 32px));border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;background-color:var(--glass-strong);transition:opacity .25s;will-change:transform}
.pop .x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--stroke);background:rgba(0,0,0,.2);cursor:pointer;display:grid;place-items:center;font-size:16px;color:var(--muted)}
.pop .x:hover{color:var(--text);border-color:var(--stroke-2)}
.pop h3{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.3;margin:2px 36px 0 0;text-wrap:balance}
.pop .au{font-size:13px;color:var(--muted);margin-top:2px}
.pop .blk{display:flex;flex-direction:column;gap:4px}
.pop .blk b{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pop .blk p{font-size:14px;line-height:1.55}
.play{pointer-events:auto;margin-top:8px;align-self:flex-start;display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 16px 0 13px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:var(--text);transition:box-shadow .2s,border-color .2s}
.play svg{color:var(--accent);filter:drop-shadow(0 0 6px var(--glow))}
.play:hover{border-color:var(--accent);box-shadow:0 0 26px -6px var(--glow)}
.panel,.doms,.zoom,.hud{transition:opacity .45s}
body.tl .panel,body.tl .doms,body.tl .zoom,body.tl .hud{opacity:0;pointer-events:none}
body.tl .hud .play{pointer-events:none}
.tlbar{position:fixed;z-index:8;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(620px,calc(100% - 32px));border-radius:24px;padding:18px 18px 16px;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px 18px;background-color:var(--glass-strong)}
.tlbar .main{display:flex;flex-direction:column;gap:8px;min-width:0}
.tlbar .step{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--muted);font-variant-numeric:tabular-nums}
.tlbar .t{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.25;text-wrap:balance}
.tlbar .a{font-size:13px;color:var(--muted)}
.tlbar .q{font-size:13.5px;font-style:italic;color:color-mix(in srgb,var(--text) 85%,transparent);border-left:2px solid var(--accent);padding-left:10px}
.tlbar .prog{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.tlbar .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--glow);transition:width .6s}
.tlbar .ctl{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.tlbar .radar{max-width:150px}
.gain{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em}
.gain i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 8px currentColor}
.quote{position:relative;font-family:var(--f-display);font-weight:300;font-size:16px;line-height:1.55;padding:16px 18px 16px 20px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,transparent),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 0 36px -16px var(--glow)}
.quote{margin:0}
.quote::before{content:"\201C";position:absolute;left:10px;top:-6px;font-size:44px;color:var(--accent);opacity:.6;line-height:1}
textarea.ta{width:100%;min-height:96px;resize:vertical;border-radius:13px;background:rgba(0,0,0,.24);border:1px solid var(--stroke);padding:12px 14px;font:inherit;font-size:15px;color:var(--text)}
textarea.ta:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.chc{display:flex;flex-direction:column;gap:12px}
.chc .hd{display:flex;align-items:flex-start;gap:12px}

function brainType(books){const read=books.filter(isRead);if(read.length<2)return null;const sc=brainScores(read),sum=sc.reduce((a,b)=>a+b,0)||1,sh=sc.map(x=>x/sum);
  const H=-sh.reduce((a,p)=>a+(p>0?p*Math.log(p):0),0)/Math.log(N);
  let best=null,bs=-2;TYPES.forEach(t=>{if(t.id==="integrator")return;const c=cos(sc,t.v);if(c>bs){bs=c;best=t}});
  const mean=sum/N,cv=Math.sqrt(sc.reduce((a,x)=>a+(x-mean)**2,0)/N)/(mean||1);if(cv<0.18)best=TYPES.find(t=>t.id==="integrator");
  const weak=sc.indexOf(Math.min(...sc));return {t:best,match:Math.round(Math.max(0,bs)*100),weak,balance:Math.round(H*100)}}

/* ================= Аналитика ================= */
function brainScores(books){const s=new Array(N).fill(0);books.filter(isRead).forEach(b=>{const k=b.rating?0.6+b.rating*0.2:1;b.w.forEach((v,i)=>s[i]+=v*k)});return s}
function profile(books){const s=new Array(N).fill(0);books.filter(isRead).forEach(b=>{const k=b.rating?b.rating-2.5:1;b.w.forEach((v,i)=>s[i]+=v*Math.max(k,-1))});return s.map(x=>Math.max(x,0.01))}
function links(books){books=books.filter(isRead);
  const out=[];const sorted=[...books].sort((a,b)=>a.ts-b.ts);
  for(let i=1;i<sorted.length;i++)out.push({a:sorted[i-1].id,b:sorted[i].id,type:"path",i});
  books.forEach(b=>{books.filter(o=>o.id!==b.id).map(o=>[cos(b.w,o.w),o]).sort((x,y)=>y[0]-x[0]).slice(0,2).forEach(([s,o])=>{
    if(s>0.93&&!out.some(l=>(l.a===b.id&&l.b===o.id)||(l.a===o.id&&l.b===b.id)))out.push({a:b.id,b:o.id,type:"sim"})})});
  return out;
}
function recommend(books){
  const p=profile(books),sc=brainScores(books),mx=Math.max(...sc,1),gap=sc.map(v=>mx-v+1);
  const read=new Set([...books,...S.books].map(b=>b.title.toLowerCase()));
  return CATALOG.filter(c=>!read.has(c.title.toLowerCase())).map(c=>{
    const best=books.map(b=>[cos(b.w,c.w)*(b.rating?b.rating/3:1),b]).sort((x,y)=>y[0]-x[0])[0];
    const score=0.72*cos(c.w,p)+0.28*cos(c.w,gap);
    return {c,score,best:best&&best[1],grow:top(c.w.map((v,i)=>v*gap[i]),1)[0]};
  }).sort((a,b)=>b.score-a.score).slice(0,6);
}

function radar(sc,k){k=k||"m";

  const poly=sc.map((v,i)=>pt(i,R*Math.max(v/mx,0.05)).join(",")).join(" ");

async function addCustom(){

    try{const r=await S.sample.json(`Ты нейропсихолог и литературный критик. Оцени книгу «${title}»${author?" ("+author+")":""}, жанр по мнению читателя: ${genre}. ${HELP}\nОтветь только JSON: {"author":"автор, если знаешь, иначе пустая строка","w":{"E":0,"L":0,"I":0,"R":0,"C":0,"M":0,"S":0},"note":"одно-два предложения по-русски: какие навыки книга развивает с точки зрения нейробиологии"}`,{modelTier:"quick"});

async function askClaude(){

    const list=Array.isArray(j&&j.books)?j.books.filter(b=>b&&typeof b.title==="string"&&Array.isArray(b.w)&&b.w.length===N):[];
    if(!list.length){OB.note="В файле нет книг.";obRender();return}
    const have=new Set(S.books.map(b=>b.title.toLowerCase()));const add=list.filter(b=>!have.has(b.title.toLowerCase())).map(b=>({id:String(b.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)).replace(/[^\w-]/g,"").slice(0,40)||Date.now().toString(36),title:b.title.slice(0,200),author:String(b.author||"").slice(0,200),w:b.w.map(x=>Math.max(0,Math.min(9,Math.round(+x||0)))),rating:Math.max(0,Math.min(5,+b.rating||0)),ts:+b.ts||Date.now(),status:["read","reading","want"].includes(b.status)?b.status:"read",startedAt:b.startedAt||null,cid:b.cid||null,note:String(b.note||"").slice(0,600),quote:String(b.quote||"").slice(0,500)}));
    if(S.mode==="cloud"){for(const b of add){try{const {id,...data}=b;await S.col.doc(id).set(data)}catch(err){}}}else{S.books.push(...add);lsSave();refresh()}
    if(!S.ch.length&&Array.isArray(j.challenges)){S.ch=j.challenges.filter(r=>r&&chDef(r.id));saveCh()}
    OB.note=add.length?`Загружено ${add.length} ${plural(add.length,"книга","книги","книг")}.${list.length>add.length?" Остальные уже были на глобусе.":""}`:"Все книги из файла уже есть на глобусе.";obRender()};
  rd.readAsText(f)});
document.addEventListener("keydown",e=>{if(OB.step&&OB.step!=="intro"){if(e.key==="Escape")obClose();if(OB.step==="guide"&&e.key==="ArrowRight"){OB.g=Math.min(GUIDE.length-1,OB.g+1);obRender()}if(OB.step==="guide"&&e.key==="ArrowLeft"){OB.g=Math.max(0,OB.g-1);obRender()}}},true);

applyPalette(store("neuroglobe.palette")||"violet");
renderDoms();refresh();
if(!store("neuroglobe.onboarded.v1"))obOpen("intro");
initStorage().catch(()=>setWho("Сохранение в этом браузере","warn"));
})();
</script>
